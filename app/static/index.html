<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portfolio Valuator (BNP)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; max-width: 1100px; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap: wrap; }
    input, select { padding: 10px; font-size: 16px; }
    input[type="number"] { width: 160px; }
    button { padding: 10px 14px; font-size: 16px; cursor: pointer; }
    #status { margin: 12px 0; padding: 10px; border-radius: 8px; }
    .info { background: #eef; }
    .success { background: #e8ffe8; }
    .warn { background: #fff6d6; }
    .error { background: #ffe8e8; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f5f5f5; }
    code { background: #f3f3f3; padding: 2px 4px; border-radius: 4px; }
    .muted { color: #666; }
    .card { border: 1px solid #eee; border-radius: 12px; padding: 14px; margin-top: 14px; background: #fff; }
    .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
    .pill { display:inline-block; background:#f6f6f6; border:1px solid #eee; border-radius:999px; padding:6px 10px; }
    .right { text-align: right; }
    .pos { color: #0a7a0a; }
    .neg { color: #b00020; }
  </style>
</head>
<body>
  <h1>Portfolio Valuator (BNP)</h1>

  <div class="muted">MVP: Portfolios in SQLite speichern, Bewertung über <code>bid</code> (BNP Push / Lightstreamer).</div>
  <div id="status" class="info">Lade…</div>

  <div class="card">
    <h2>Übersicht</h2>
    <div class="row">
      <span class="pill muted">Auto-Bewertung: <strong id="autoEvery">—</strong></span>
      <span class="pill muted">Letzte Aktualisierung: <strong id="lastRefresh">—</strong></span>
      <button id="refreshBtn">Jetzt aktualisieren</button>
    </div>
    <div class="row" style="margin-top: 10px;">
      <input id="newPortfolioName" placeholder="Neues Portfolio (Name)" style="min-width: 320px;" />
      <button id="createPortfolioBtn">Portfolio anlegen</button>
    </div>
    <div class="muted" style="margin-top: 8px;">Alle Portfolios werden kontinuierlich bewertet (Bid). Änderungen an Positionen werden beim nächsten Refresh sichtbar.</div>
  </div>

  <div id="portfolios"></div>

  <script>
    const statusEl = document.getElementById("status");
    const portfoliosEl = document.getElementById("portfolios");

    const autoEveryEl = document.getElementById("autoEvery");
    const lastRefreshEl = document.getElementById("lastRefresh");
    const refreshBtn = document.getElementById("refreshBtn");

    const newPortfolioName = document.getElementById("newPortfolioName");
    const createPortfolioBtn = document.getElementById("createPortfolioBtn");

    function setStatus(level, message) {
      statusEl.className = level;
      statusEl.textContent = message;
    }

    function fmtNum(n, digits=4) {
      if (n === null || n === undefined) return "—";
      if (!isFinite(n)) return "—";
      return Number(n).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: digits });
    }

    function fmtPct(x) {
      if (x === null || x === undefined) return "—";
      const pct = x * 100;
      return pct.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
    }

    function clsPnL(x) {
      if (x === null || x === undefined) return "";
      return x >= 0 ? "pos" : "neg";
    }

    async function api(path, options={}) {
      const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
      if (!res.ok) {
        const txt = await res.text().catch(() => "");
        throw new Error(txt || ("HTTP " + res.status));
      }
      const ct = res.headers.get("content-type") || "";
      if (ct.includes("application/json")) return await res.json();
      return await res.text();
    }

    function renderAll(valuations) {
      portfoliosEl.innerHTML = "";

      if (!valuations || !valuations.length) {
        const empty = document.createElement("div");
        empty.className = "card";
        empty.innerHTML = "<h2>Keine Portfolios</h2><div class='muted'>Lege oben ein Portfolio an.</div>";
        portfoliosEl.appendChild(empty);
        return;
      }

      for (const v of valuations) {
        const pf = v.portfolio;
        const positions = v.positions || [];

        const card = document.createElement("div");
        card.className = "card";

        const header = document.createElement("div");
        header.className = "row";
        header.innerHTML = `
          <h2 style="margin:0; flex:1 1 auto;">${pf.name} <span class="muted">(#${pf.id})</span></h2>
          <span class="pill">Market Value: <strong>${fmtNum(v.totals?.market_value, 6)}</strong></span>
          <span class="pill">Cost Basis: <strong>${fmtNum(v.totals?.cost_basis, 6)}</strong></span>
          <span class="pill">PnL: <strong class="${clsPnL(v.totals?.pnl)}">${fmtNum(v.totals?.pnl, 6)}</strong></span>
          <span class="pill muted">valued_at: <strong>${v.valued_at || "—"}</strong></span>
        `;
        card.appendChild(header);

        const table = document.createElement("table");
        table.innerHTML = `
          <thead>
            <tr>
              <th>ISIN</th>
              <th class="right">Quantity</th>
              <th class="right">Entry</th>
              <th class="right">Bid</th>
              <th class="right">Market Value</th>
              <th class="right">Cost Basis</th>
              <th class="right">PnL</th>
              <th class="right">PnL %</th>
            </tr>
          </thead>
          <tbody></tbody>
        `;

        const tb = table.querySelector("tbody");
        for (const p of positions) {
          const tr = document.createElement("tr");
          const cells = [
            p.isin,
            fmtNum(p.quantity, 6),
            fmtNum(p.entry_price, 6),
            (p.bid === null || p.bid === undefined) ? "—" : fmtNum(p.bid, 6),
            (p.market_value === null || p.market_value === undefined) ? "—" : fmtNum(p.market_value, 6),
            fmtNum(p.cost_basis, 6),
            (p.pnl === null || p.pnl === undefined) ? "—" : fmtNum(p.pnl, 6),
            (p.pnl_pct === null || p.pnl_pct === undefined) ? "—" : fmtPct(p.pnl_pct),
          ];

          cells.forEach((val, i) => {
            const td = document.createElement("td");
            td.textContent = val;
            if (i >= 1) td.classList.add("right");
            if (i === 6 || i === 7) {
              const c = clsPnL(p.pnl);
              if (c) td.classList.add(c);
            }
            tr.appendChild(td);
          });
          tb.appendChild(tr);
        }
        card.appendChild(table);

        const form = document.createElement("div");
        form.innerHTML = `
          <div class="muted" style="margin-top: 10px;">Position hinzufügen / ersetzen (gleiche ISIN wird ersetzt)</div>
          <div class="row" style="margin-top: 8px;">
            <input data-is="isin" placeholder="ISIN (12 Zeichen)" style="width: 220px;" />
            <input data-is="qty" type="number" step="any" min="0" placeholder="Quantity" />
            <input data-is="entry" type="number" step="any" min="0" placeholder="Entry Price" />
            <button data-is="save">Speichern</button>
          </div>
        `;

        form.querySelector('[data-is="save"]').onclick = async () => {
          const isin = (form.querySelector('[data-is="isin"]').value || "").trim().toUpperCase();
          const qty = Number(form.querySelector('[data-is="qty"]').value);
          const entry = Number(form.querySelector('[data-is="entry"]').value);
          if (!isin || !isFinite(qty) || qty <= 0 || !isFinite(entry) || entry <= 0) {
            setStatus("error", "Bitte ISIN, Quantity (>0) und Entry Price (>0) angeben.");
            return;
          }

          const next = (positions || [])
            .filter(x => x.isin !== isin)
            .map(x => ({ isin: x.isin, quantity: x.quantity, entry_price: x.entry_price }));
          next.push({ isin, quantity: qty, entry_price: entry });

          setStatus("info", `Speichere Positionen für Portfolio #${pf.id}…`);
          await api(`/api/portfolios/${pf.id}/positions`, { method: "PUT", body: JSON.stringify(next) });
          await refreshAll();
          setStatus("success", `Position gespeichert (Portfolio #${pf.id}).`);
        };

        card.appendChild(form);
        portfoliosEl.appendChild(card);
      }
    }

    async function createPortfolio() {
      const name = (newPortfolioName.value || "").trim();
      if (!name) return;
      setStatus("info", "Lege Portfolio an…");
      const p = await api("/api/portfolios", { method: "POST", body: JSON.stringify({ name }) });
      newPortfolioName.value = "";
      await refreshAll();
      setStatus("success", `Portfolio angelegt: ${p.name} (#${p.id}).`);
    }

    createPortfolioBtn.onclick = () => createPortfolio().catch(e => setStatus("error", String(e.message || e)));

    const AUTO_REFRESH_MS = 5000;
    autoEveryEl.textContent = `${AUTO_REFRESH_MS/1000}s`;

    async function refreshAll() {
      const vals = await api("/api/portfolios/valuations");
      renderAll(vals);
      lastRefreshEl.textContent = new Date().toLocaleTimeString();
    }

    refreshBtn.onclick = () => refreshAll().catch(e => setStatus("error", String(e.message || e)));

    // Start + kontinuierlich aktualisieren
    refreshAll()
      .then(() => setStatus("success", "Daten geladen. Auto-Bewertung läuft…"))
      .catch(e => setStatus("error", String(e.message || e)));
    setInterval(() => refreshAll().catch(() => {}), AUTO_REFRESH_MS);
  </script>
</body>
</html>
