<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BNP Push MVP</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; max-width: 1000px; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap: wrap; }
    input { padding: 10px; font-size: 16px; width: 260px; }
    button { padding: 10px 14px; font-size: 16px; cursor: pointer; }
    #status { margin: 12px 0; padding: 10px; border-radius: 8px; }
    .info { background: #eef; }
    .success { background: #e8ffe8; }
    .warn { background: #fff6d6; }
    .error { background: #ffe8e8; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f5f5f5; }
    code { background: #f3f3f3; padding: 2px 4px; border-radius: 4px; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>BNP Push MVP (Lightstreamer)</h1>

  <div class="row">
    <label for="isin"><strong>ISIN</strong></label>
    <input id="isin" placeholder="z.B. DE000PK6M705" />
    <button id="btn">Subscribe</button>
    <span class="muted">zeigt nur Live-Push, kein Speichern</span>
  </div>

  <div id="status" class="info">Lade…</div>

  <h2>Letztes Update</h2>
  <div class="muted">Tipp: die spannendsten Felder sind <code>bid</code>, <code>ask</code>, <code>quotetime</code>, <code>last</code>.</div>

  <table>
    <thead>
      <tr>
        <th>Feld</th>
        <th>Wert</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <h2>Raw JSON</h2>
  <pre id="raw" style="white-space: pre-wrap; background:#fafafa; padding:12px; border:1px solid #eee; border-radius:10px;"></pre>

  <script>
    const statusEl = document.getElementById("status");
    const tbody = document.getElementById("tbody");
    const rawEl = document.getElementById("raw");
    const isinEl = document.getElementById("isin");
    const btn = document.getElementById("btn");

    function setStatus(level, message) {
      statusEl.className = level;
      statusEl.textContent = message;
    }

    function renderFields(obj) {
      tbody.innerHTML = "";
      const keys = Object.keys(obj);
      keys.sort((a,b) => a.localeCompare(b));
      for (const k of keys) {
        const tr = document.createElement("tr");
        const tdK = document.createElement("td");
        const tdV = document.createElement("td");
        tdK.textContent = k;
        tdV.textContent = (obj[k] === null || obj[k] === undefined) ? "" : String(obj[k]);
        tr.appendChild(tdK);
        tr.appendChild(tdV);
        tbody.appendChild(tr);
      }
    }

    const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
    const ws = new WebSocket(wsUrl);

    ws.onopen = () => setStatus("info", "Verbunden. Bitte ISIN eingeben und Subscribe klicken.");
    ws.onclose = () => setStatus("error", "WebSocket getrennt.");
    ws.onerror = () => setStatus("error", "WebSocket Fehler.");

    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }

      if (msg.type === "status") {
        setStatus(msg.level || "info", msg.message || "");
        return;
      }

      if (msg.type === "quote") {
        // parsed enthält floats wo möglich
        renderFields(msg.parsed || {});
        rawEl.textContent = JSON.stringify(msg, null, 2);
      }
    };

    btn.onclick = () => {
      const isin = (isinEl.value || "").trim().toUpperCase();
      ws.send(JSON.stringify({ type: "subscribe", isin }));
      setStatus("info", "Subscribe gesendet…");
    };

    // Komfort: Enter im Input
    isinEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") btn.click();
    });
  </script>
</body>
</html>
