<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Watchlist</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #6b7280;
      --line: #e6e9f0;
      --accent: #2d6cdf;
      --accent-soft: #eef3ff;
      --nav-bg: #0f172a;
      --nav-text: #e2e8f0;
      --nav-muted: #94a3b8;
      --nav-hover: #1e293b;
      --nav-active: #1d4ed8;
      --nav-width: 240px;
      --nav-collapsed: 72px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--nav-width);
      background: var(--nav-bg);
      color: var(--nav-text);
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 18px 14px;
      transition: width 0.2s ease;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--nav-active);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
    }
    .brand-title { font-weight: 600; letter-spacing: 0.02em; }
    .nav-toggle {
      margin-left: auto;
      border: 1px solid #334155;
      background: transparent;
      color: var(--nav-text);
      border-radius: 8px;
      padding: 4px 8px;
      cursor: pointer;
    }
    .nav { display: flex; flex-direction: column; gap: 6px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--nav-text);
      text-decoration: none;
    }
    .nav-item:hover { background: var(--nav-hover); }
    .nav-item.active {
      background: #1f2a44;
      border: 1px solid #334155;
    }
    .nav-icon { width: 22px; text-align: center; font-weight: 600; }
    .nav-text { white-space: nowrap; }
    .nav-footer { margin-top: auto; font-size: 12px; color: var(--nav-muted); }
    .main { flex: 1; min-width: 0; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px 32px 32px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 28px; }
    h2 { margin: 0 0 6px 0; font-size: 20px; }
    .sub { color: var(--muted); font-size: 14px; }
    .button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }
    .button.ghost {
      background: transparent;
      color: var(--accent);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
    }
    .status.info { background: #eef3ff; color: #23448b; }
    .status.success { background: #e7f7ea; color: #1f6f3a; }
    .status.warn { background: #fff2dc; color: #8a5a17; }
    .status.error { background: #ffe7ea; color: #8f1d2f; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); }
    th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    input, select {
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 14px;
    }
    .inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .drag-handle { cursor: grab; color: var(--muted); font-weight: 700; }
    tr.dragging { opacity: 0.5; }
    body.nav-collapsed .sidebar { width: var(--nav-collapsed); }
    body.nav-collapsed .nav-text,
    body.nav-collapsed .brand-title,
    body.nav-collapsed .nav-footer { display: none; }
    @media (max-width: 900px) {
      .app { flex-direction: column; }
      .sidebar { width: 100%; flex-direction: row; align-items: center; }
      body.nav-collapsed .sidebar { width: 100%; }
      .nav { flex-direction: row; flex-wrap: wrap; }
      .nav-footer { display: none; }
      header { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sideNav">
      <div class="brand">
        <div class="logo">PV</div>
        <div class="brand-title">Portfolio</div>
        <button id="navToggle" class="nav-toggle" aria-label="Menue umschalten">≡</button>
      </div>
      <nav class="nav">
        <a class="nav-item" href="/" title="Uebersicht"><span class="nav-icon">U</span><span class="nav-text">Uebersicht</span></a>
        <a class="nav-item" href="/instruments" title="Instrumente"><span class="nav-icon">I</span><span class="nav-text">Instrumente</span></a>
        <a class="nav-item" href="/sources" title="Kursquellen"><span class="nav-icon">K</span><span class="nav-text">Kursquellen</span></a>
        <a class="nav-item active" href="/watchlist" title="Watchlist"><span class="nav-icon">W</span><span class="nav-text">Watchlist</span></a>
        <a class="nav-item" href="/positions" title="Positionen"><span class="nav-icon">P</span><span class="nav-text">Positionen</span></a>
        <a class="nav-item" href="/settings" title="Einstellungen"><span class="nav-icon">E</span><span class="nav-text">Einstellungen</span></a>
      </nav>
      <div class="nav-footer">Watchlist verwalten</div>
    </aside>
    <main class="main">
      <div class="container">
        <header>
          <div>
            <div class="sub">Verwaltung</div>
            <h1>Watchlist</h1>
            <div class="sub">Live-Instrumente konfigurieren</div>
          </div>
        </header>

        <div id="status" class="status info">Lade...</div>

        <section class="card" style="margin-top: 16px;">
          <h2>Watchlist</h2>
          <div class="sub">Instrumente fuer Live-Kurse</div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th></th>
                  <th>Instrument</th>
                  <th>Label</th>
                  <th>Waehrung</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="watchlistTbody"></tbody>
            </table>
          </div>
          <div class="inline-form" style="margin-top: 12px;">
            <select id="newWatchInstrument"></select>
            <input id="newWatchLabel" placeholder="Label (optional)" />
            <select id="newWatchCurrency">
              <option value="EUR">EUR</option>
              <option value="USD">USD</option>
              <option value="CHF">CHF</option>
              <option value="GBP">GBP</option>
            </select>
            <button id="addWatchBtn" class="button">Hinzufuegen</button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const navToggle = document.getElementById("navToggle");
    const storedNav = localStorage.getItem("pv_nav_collapsed");
    if (storedNav === "1") document.body.classList.add("nav-collapsed");
    if (navToggle) {
      navToggle.onclick = () => {
        document.body.classList.toggle("nav-collapsed");
        localStorage.setItem(
          "pv_nav_collapsed",
          document.body.classList.contains("nav-collapsed") ? "1" : "0"
        );
      };
    }

    const watchlistTbody = document.getElementById("watchlistTbody");
    const newWatchInstrument = document.getElementById("newWatchInstrument");
    const newWatchLabel = document.getElementById("newWatchLabel");
    const newWatchCurrency = document.getElementById("newWatchCurrency");
    const addWatchBtn = document.getElementById("addWatchBtn");

    const state = {
      instruments: [],
      watchlist: [],
    };

    function setStatus(level, message) {
      statusEl.className = "status " + level;
      statusEl.textContent = message;
    }

    async function api(path, options={}) {
      const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
      if (!res.ok) {
        const txt = await res.text().catch(() => "");
        throw new Error(txt || ("HTTP " + res.status));
      }
      const ct = res.headers.get("content-type") || "";
      if (ct.includes("application/json")) return await res.json();
      return await res.text();
    }

    function getDragAfterElement(container, y) {
      const els = [...container.querySelectorAll("tr:not(.dragging)")];
      return els.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset, element: child };
        }
        return closest;
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function setupRowDrag(tbody, onReorder) {
      let dragging = null;
      tbody.addEventListener("dragstart", (e) => {
        const handle = e.target.closest(".drag-handle");
        if (!handle) return;
        const tr = e.target.closest("tr");
        if (!tr) return;
        dragging = tr;
        tr.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
      });
      tbody.addEventListener("dragend", () => {
        if (dragging) dragging.classList.remove("dragging");
        dragging = null;
      });
      tbody.addEventListener("dragover", (e) => {
        if (!dragging) return;
        e.preventDefault();
        const after = getDragAfterElement(tbody, e.clientY);
        if (after == null) {
          tbody.appendChild(dragging);
        } else {
          tbody.insertBefore(dragging, after);
        }
      });
      tbody.addEventListener("drop", async () => {
        if (!dragging) return;
        const ids = [...tbody.querySelectorAll("tr")]
          .map(row => Number(row.dataset.id))
          .filter(Boolean);
        if (ids.length) {
          await onReorder(ids);
        }
      });
    }

    function renderInstrumentSelect(select, instruments, selectedId) {
      select.innerHTML = "";
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "Instrument waehlen";
      select.appendChild(placeholder);
      for (const inst of instruments) {
        const opt = document.createElement("option");
        opt.value = String(inst.id);
        const name = inst.name || inst.code || ("#" + inst.id);
        opt.textContent = `${name} (${inst.code || "-"})`;
        select.appendChild(opt);
      }
      if (selectedId) select.value = String(selectedId);
    }

    function renderWatchlist() {
      watchlistTbody.innerHTML = "";
      for (const item of state.watchlist) {
        const tr = document.createElement("tr");
        tr.dataset.id = String(item.id || "");
        const tdDrag = document.createElement("td");
        const tdInst = document.createElement("td");
        const tdLabel = document.createElement("td");
        const tdCurr = document.createElement("td");
        const tdActions = document.createElement("td");

        const dragHandle = document.createElement("span");
        dragHandle.className = "drag-handle";
        dragHandle.textContent = "⋮⋮";
        dragHandle.draggable = true;
        tdDrag.appendChild(dragHandle);

        const instSelect = document.createElement("select");
        renderInstrumentSelect(instSelect, state.instruments, item.instrument_id);
        instSelect.onchange = async () => {
          item.instrument_id = Number(instSelect.value);
          await updateWatchlistItem(item);
        };

        const labelInput = document.createElement("input");
        labelInput.value = item.label || "";
        labelInput.onchange = async () => {
          item.label = labelInput.value.trim();
          await updateWatchlistItem(item);
        };

        const currSelect = document.createElement("select");
        ["EUR", "USD", "CHF", "GBP"].forEach(c => {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          currSelect.appendChild(opt);
        });
        currSelect.value = (item.currency || "EUR").toUpperCase();
        currSelect.onchange = async () => {
          item.currency = currSelect.value;
          await updateWatchlistItem(item);
        };

        const delBtn = document.createElement("button");
        delBtn.className = "button ghost";
        delBtn.textContent = "Entfernen";
        delBtn.onclick = async () => {
          setStatus("info", "Entferne Watchlist-Eintrag...");
          await api(`/api/watchlist/${item.id}`, { method: "DELETE" });
          await loadWatchlist();
          setStatus("success", "Watchlist-Eintrag entfernt.");
        };

        tdInst.appendChild(instSelect);
        tdLabel.appendChild(labelInput);
        tdCurr.appendChild(currSelect);
        tdActions.appendChild(delBtn);

        tr.appendChild(tdDrag);
        tr.appendChild(tdInst);
        tr.appendChild(tdLabel);
        tr.appendChild(tdCurr);
        tr.appendChild(tdActions);
        watchlistTbody.appendChild(tr);
      }
    }

    async function loadInstruments() {
      state.instruments = await api("/api/instruments");
      renderInstrumentSelect(newWatchInstrument, state.instruments);
      renderWatchlist();
    }

    async function loadWatchlist() {
      state.watchlist = await api("/api/watchlist");
      renderWatchlist();
    }

    async function saveWatchlistOrder(ids) {
      setStatus("info", "Speichere Sortierung...");
      await api("/api/watchlist/order", {
        method: "PUT",
        body: JSON.stringify({ ids }),
      });
      await loadWatchlist();
      setStatus("success", "Sortierung gespeichert.");
    }

    async function addWatchlistItem() {
      const instrumentId = Number(newWatchInstrument.value);
      if (!instrumentId) {
        setStatus("warn", "Bitte Instrument waehlen.");
        return;
      }
      const payload = {
        instrument_id: instrumentId,
        label: newWatchLabel.value.trim() || null,
        currency: newWatchCurrency.value,
      };
      setStatus("info", "Fuege Watchlist-Eintrag hinzu...");
      await api("/api/watchlist", { method: "POST", body: JSON.stringify(payload) });
      newWatchLabel.value = "";
      await loadWatchlist();
      setStatus("success", "Watchlist-Eintrag hinzugefuegt.");
    }

    async function updateWatchlistItem(item) {
      if (!item.id) return;
      const payload = {
        instrument_id: item.instrument_id,
        label: item.label || null,
        currency: item.currency,
      };
      setStatus("info", "Speichere Watchlist...");
      await api(`/api/watchlist/${item.id}`, { method: "PUT", body: JSON.stringify(payload) });
      setStatus("success", "Watchlist gespeichert.");
    }

    addWatchBtn.onclick = () => addWatchlistItem().catch(e => setStatus("error", String(e.message || e)));
    newWatchInstrument.onchange = () => {
      const inst = state.instruments.find(i => String(i.id) === String(newWatchInstrument.value));
      if (inst && inst.currency) newWatchCurrency.value = inst.currency;
    };

    setupRowDrag(watchlistTbody, saveWatchlistOrder);

    Promise.all([loadInstruments(), loadWatchlist()])
      .then(() => setStatus("success", "Bereit."))
      .catch(e => setStatus("error", String(e.message || e)));
  </script>
</body>
</html>
