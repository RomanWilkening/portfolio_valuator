<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portfolio Dashboard (BNP)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; max-width: 1100px; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap: wrap; }
    button { padding: 10px 14px; font-size: 16px; cursor: pointer; }
    #status { margin: 12px 0; padding: 10px; border-radius: 8px; }
    .info { background: #eef; }
    .success { background: #e8ffe8; }
    .warn { background: #fff6d6; }
    .error { background: #ffe8e8; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f5f5f5; }
    code { background: #f3f3f3; padding: 2px 4px; border-radius: 4px; }
    .muted { color: #666; }
    .card { border: 1px solid #eee; border-radius: 12px; padding: 14px; margin-top: 14px; background: #fff; }
    .pill { display:inline-block; background:#f6f6f6; border:1px solid #eee; border-radius:999px; padding:6px 10px; }
    .right { text-align: right; }
    .pos { color: #0a7a0a; }
    .neg { color: #b00020; }
    a { color: inherit; }
  </style>
</head>
<body>
  <div class="row" style="justify-content: space-between;">
    <h1 style="margin:0;">Portfolio Dashboard (BNP)</h1>
    <div class="row">
      <a class="pill" href="/manage">Zur Portfolio-Pflege</a>
    </div>
  </div>

  <div class="muted">Anzeige-Seite: alle Portfolios sichtbar, Bewertung über <code>bid</code> via Live-Stream.</div>
  <div id="status" class="info">Lade…</div>

  <div class="card">
    <div class="row">
      <span class="pill muted">Stream: <strong id="streamState">—</strong></span>
      <span class="pill muted">Letztes Quote: <strong id="lastQuoteAt">—</strong></span>
      <button id="reconnectBtn">Reconnect</button>
    </div>
  </div>

  <div id="portfolios"></div>

  <script>
    const statusEl = document.getElementById("status");
    const portfoliosEl = document.getElementById("portfolios");
    const streamStateEl = document.getElementById("streamState");
    const lastQuoteAtEl = document.getElementById("lastQuoteAt");
    const reconnectBtn = document.getElementById("reconnectBtn");

    function setStatus(level, message) {
      statusEl.className = level;
      statusEl.textContent = message;
    }

    function fmtNum(n, digits=4) {
      if (n === null || n === undefined) return "—";
      if (!isFinite(n)) return "—";
      return Number(n).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: digits });
    }

    function fmtPct(x) {
      if (x === null || x === undefined) return "—";
      const pct = x * 100;
      return pct.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
    }

    function clsPnL(x) {
      if (x === null || x === undefined) return "";
      return x >= 0 ? "pos" : "neg";
    }

    async function api(path, options={}) {
      const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
      if (!res.ok) {
        const txt = await res.text().catch(() => "");
        throw new Error(txt || ("HTTP " + res.status));
      }
      const ct = res.headers.get("content-type") || "";
      if (ct.includes("application/json")) return await res.json();
      return await res.text();
    }

    // DOM Index: wo welche ISIN vorkommt + Portfolio-Totals
    const state = {
      portfolios: new Map(), // pid -> { positions: Map(isin -> posData), totalsEl: {...}, rowsByIsin: Map(isin -> {bidEl,mvEl,pnlEl,pnlPctEl}) }
      isinsToPortfolios: new Map(), // isin -> Set(pid)
      bids: new Map(), // isin -> bid (number)
    };

    function renderAll(valuations) {
      portfoliosEl.innerHTML = "";
      state.portfolios.clear();
      state.isinsToPortfolios.clear();

      if (!valuations || !valuations.length) {
        const empty = document.createElement("div");
        empty.className = "card";
        empty.innerHTML = "<h2>Keine Portfolios</h2><div class='muted'>Lege ein Portfolio unter <a href='/manage'>Portfolio-Pflege</a> an.</div>";
        portfoliosEl.appendChild(empty);
        return;
      }

      for (const v of valuations) {
        const pf = v.portfolio;
        const positions = v.positions || [];
        const pid = Number(pf.id);

        const card = document.createElement("div");
        card.className = "card";

        const header = document.createElement("div");
        header.className = "row";
        header.innerHTML = `
          <h2 style="margin:0; flex:1 1 auto;">${pf.name} <span class="muted">(#${pf.id})</span></h2>
          <span class="pill">Market Value: <strong data-t="mv">${fmtNum(v.totals?.market_value, 6)}</strong></span>
          <span class="pill">Cost Basis: <strong data-t="cb">${fmtNum(v.totals?.cost_basis, 6)}</strong></span>
          <span class="pill">PnL: <strong data-t="pnl" class="${clsPnL(v.totals?.pnl)}">${fmtNum(v.totals?.pnl, 6)}</strong></span>
          <span class="pill muted">valued_at: <strong data-t="at">${v.valued_at || "—"}</strong></span>
        `;
        card.appendChild(header);

        const table = document.createElement("table");
        table.innerHTML = `
          <thead>
            <tr>
              <th>ISIN</th>
              <th class="right">Quantity</th>
              <th class="right">Entry</th>
              <th class="right">Bid</th>
              <th class="right">Market Value</th>
              <th class="right">Cost Basis</th>
              <th class="right">PnL</th>
              <th class="right">PnL %</th>
            </tr>
          </thead>
          <tbody></tbody>
        `;

        const tb = table.querySelector("tbody");

        const portfolioState = {
          positions: new Map(), // isin -> {quantity, entry_price}
          totalsEl: {
            mv: header.querySelector('[data-t="mv"]'),
            cb: header.querySelector('[data-t="cb"]'),
            pnl: header.querySelector('[data-t="pnl"]'),
            at: header.querySelector('[data-t="at"]'),
          },
          rowsByIsin: new Map(),
        };

        for (const p of positions) {
          const tr = document.createElement("tr");
          const isin = p.isin;
          portfolioState.positions.set(isin, { quantity: Number(p.quantity), entry_price: Number(p.entry_price) });
          if (!state.isinsToPortfolios.has(isin)) state.isinsToPortfolios.set(isin, new Set());
          state.isinsToPortfolios.get(isin).add(pid);

          // Cache initial bid if present
          if (p.bid !== null && p.bid !== undefined) state.bids.set(isin, Number(p.bid));

          const cells = [
            isin,
            fmtNum(p.quantity, 6),
            fmtNum(p.entry_price, 6),
            (p.bid === null || p.bid === undefined) ? "—" : fmtNum(p.bid, 6),
            (p.market_value === null || p.market_value === undefined) ? "—" : fmtNum(p.market_value, 6),
            fmtNum(p.cost_basis, 6),
            (p.pnl === null || p.pnl === undefined) ? "—" : fmtNum(p.pnl, 6),
            (p.pnl_pct === null || p.pnl_pct === undefined) ? "—" : fmtPct(p.pnl_pct),
          ];

          let bidEl, mvEl, pnlEl, pnlPctEl;
          cells.forEach((val, i) => {
            const td = document.createElement("td");
            td.textContent = val;
            if (i >= 1) td.classList.add("right");
            if (i === 6 || i === 7) {
              const c = clsPnL(p.pnl);
              if (c) td.classList.add(c);
            }
            if (i === 3) bidEl = td;
            if (i === 4) mvEl = td;
            if (i === 6) pnlEl = td;
            if (i === 7) pnlPctEl = td;
            tr.appendChild(td);
          });
          tb.appendChild(tr);

          portfolioState.rowsByIsin.set(isin, { bidEl, mvEl, pnlEl, pnlPctEl });
        }
        card.appendChild(table);
        portfoliosEl.appendChild(card);
        state.portfolios.set(pid, portfolioState);
      }
    }

    function recomputePortfolio(pid) {
      const pf = state.portfolios.get(pid);
      if (!pf) return;
      let mv = 0;
      let cb = 0;
      for (const [isin, pos] of pf.positions.entries()) {
        cb += pos.entry_price * pos.quantity;
        const bid = state.bids.get(isin);
        if (bid !== undefined) mv += bid * pos.quantity;
      }
      const pnl = mv - cb;
      pf.totalsEl.mv.textContent = fmtNum(mv, 6);
      pf.totalsEl.cb.textContent = fmtNum(cb, 6);
      pf.totalsEl.pnl.textContent = fmtNum(pnl, 6);
      pf.totalsEl.pnl.className = clsPnL(pnl);
      pf.totalsEl.at.textContent = new Date().toISOString();
    }

    function applyQuoteUpdate(isin, bid, quotetime) {
      state.bids.set(isin, Number(bid));
      lastQuoteAtEl.textContent = (quotetime && String(quotetime).trim()) ? String(quotetime) : new Date().toLocaleTimeString();

      const pids = state.isinsToPortfolios.get(isin);
      if (!pids) return;

      for (const pid of pids.values()) {
        const pf = state.portfolios.get(pid);
        if (!pf) continue;
        const row = pf.rowsByIsin.get(isin);
        const pos = pf.positions.get(isin);
        if (!row || !pos) continue;

        const mv = bid * pos.quantity;
        const cb = pos.entry_price * pos.quantity;
        const pnl = mv - cb;
        const pnlPct = cb ? (pnl / cb) : null;

        row.bidEl.textContent = fmtNum(bid, 6);
        row.mvEl.textContent = fmtNum(mv, 6);
        row.pnlEl.textContent = fmtNum(pnl, 6);
        row.pnlPctEl.textContent = pnlPct === null ? "—" : fmtPct(pnlPct);

        row.pnlEl.className = "right " + clsPnL(pnl);
        row.pnlPctEl.className = "right " + clsPnL(pnl);

        recomputePortfolio(pid);
      }
    }

    let ws = null;
    function connectWs() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
      const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
      ws = new WebSocket(wsUrl);
      streamStateEl.textContent = "connecting…";

      ws.onopen = () => {
        streamStateEl.textContent = "connected";
        setStatus("success", "Stream verbunden. Updates kommen live.");
      };
      ws.onclose = () => {
        streamStateEl.textContent = "disconnected";
        setStatus("warn", "Stream getrennt. Reconnect in 2s…");
        setTimeout(connectWs, 2000);
      };
      ws.onerror = () => {
        streamStateEl.textContent = "error";
      };
      ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }

        if (msg.type === "status") {
          setStatus(msg.level || "info", msg.message || "");
          return;
        }

        if (msg.type === "snapshot") {
          renderAll(msg.valuations || []);
          return;
        }

        if (msg.type === "quote") {
          applyQuoteUpdate(msg.isin, msg.bid, msg.quotetime);
        }
      };
    }

    reconnectBtn.onclick = () => {
      try { if (ws) ws.close(); } catch {}
      connectWs();
    };

    // Initial snapshot + WS connect
    api("/api/portfolios/valuations")
      .then(vals => { renderAll(vals); connectWs(); })
      .catch(e => setStatus("error", String(e.message || e)));
  </script>
</body>
</html>
