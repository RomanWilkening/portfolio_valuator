<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portfolio Valuator</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #6b7280;
      --line: #e6e9f0;
      --accent: #2d6cdf;
      --accent-soft: #eef3ff;
      --success: #0a7a0a;
      --danger: #b00020;
      --warn: #b7791f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 28px; }
    h2 { margin: 0 0 6px 0; font-size: 20px; }
    .sub { color: var(--muted); font-size: 14px; }
    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }
    .button.ghost {
      background: transparent;
      color: var(--accent);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-top: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    .stats {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }
    .stat {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 160px;
    }
    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
    }
    .status.info { background: #eef3ff; color: #23448b; }
    .status.success { background: #e7f7ea; color: #1f6f3a; }
    .status.warn { background: #fff2dc; color: #8a5a17; }
    .status.error { background: #ffe7ea; color: #8f1d2f; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); }
    th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .pos { color: var(--success); }
    .neg { color: var(--danger); }
    .stack { display: flex; flex-direction: column; gap: 2px; }
    .subtle { font-size: 12px; color: var(--muted); }
    .source {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, select {
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 14px;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    @media (max-width: 900px) {
      header { align-items: flex-start; }
      .actions { width: 100%; justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="sub">Live Dashboard</div>
        <h1>Portfolio Valuator</h1>
        <div class="sub">Bewertung ueber priorisierte Kursquellen</div>
      </div>
      <div class="actions">
        <a class="button ghost" href="/manage">Portfolio und Instrumente</a>
        <button class="button" id="reconnectBtn">Reconnect</button>
      </div>
    </header>

    <section class="card">
      <div class="stats">
        <div class="stat">
          <span class="sub">Stream</span>
          <strong id="streamState">—</strong>
        </div>
        <div class="stat">
          <span class="sub">Letztes Quote</span>
          <strong id="lastQuoteAt">—</strong>
        </div>
      </div>
      <div id="status" class="status info">Lade...</div>
    </section>

    <section class="card">
      <div class="section-head">
        <div>
          <h2>Watchlist</h2>
          <div class="sub">Instrumente ohne Portfolio live beobachten</div>
        </div>
        <div class="inline-form">
          <select id="watchInstrument"></select>
          <input id="watchLabel" placeholder="Label (optional)" />
          <select id="watchCurrency">
            <option value="EUR">EUR</option>
            <option value="USD">USD</option>
            <option value="CHF">CHF</option>
            <option value="GBP">GBP</option>
          </select>
          <button id="addWatchBtn" class="button">Hinzufuegen</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Instrument</th>
              <th>Label</th>
              <th class="num">Kurs</th>
              <th>Quelle</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="watchTbody"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="section-head">
        <div>
          <h2>FX-Kurse</h2>
          <div class="sub">Ueberblick fuer Umrechnungen</div>
        </div>
        <span class="source">FX</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Paar</th>
              <th>Name</th>
              <th class="num">Kurs</th>
              <th>Quelle</th>
              <th>Letztes Update</th>
            </tr>
          </thead>
          <tbody id="fxTbody"></tbody>
        </table>
      </div>
    </section>

    <div id="portfolios"></div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const portfoliosEl = document.getElementById("portfolios");
    const streamStateEl = document.getElementById("streamState");
    const lastQuoteAtEl = document.getElementById("lastQuoteAt");
    const reconnectBtn = document.getElementById("reconnectBtn");
    const watchInstrumentEl = document.getElementById("watchInstrument");
    const watchLabelEl = document.getElementById("watchLabel");
    const watchCurrencyEl = document.getElementById("watchCurrency");
    const addWatchBtn = document.getElementById("addWatchBtn");
    const watchTbody = document.getElementById("watchTbody");
    const fxTbody = document.getElementById("fxTbody");

    function setStatus(level, message) {
      statusEl.className = "status " + level;
      statusEl.textContent = message;
    }

    function fmtNum(n) {
      if (n === null || n === undefined) return "—";
      if (!isFinite(n)) return "—";
      return Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function fmtPct(x) {
      if (x === null || x === undefined) return "—";
      const pct = x * 100;
      return pct.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
    }

    function clsPnL(x) {
      if (x === null || x === undefined) return "";
      return x >= 0 ? "pos" : "neg";
    }

    async function api(path, options={}) {
      const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
      if (!res.ok) {
        const txt = await res.text().catch(() => "");
        throw new Error(txt || ("HTTP " + res.status));
      }
      const ct = res.headers.get("content-type") || "";
      if (ct.includes("application/json")) return await res.json();
      return await res.text();
    }

    const state = {
      instruments: [],
      fxInstruments: new Map(),
      portfolios: new Map(),
      codesToPortfolios: new Map(),
      bids: new Map(),
      prices: new Map(),
      priceSources: new Map(),
      watchPrices: new Map(),
      watchFields: new Map(),
      watchSources: new Map(),
      fxRates: new Map(),
      fxDependents: new Map(),
      fxRows: new Map(),
      fxUpdatedAt: new Map(),
      watch: {
        byId: new Map(),
        rowById: new Map(),
        idByCode: new Map(),
      },
    };

    function renderInstrumentSelect(select, instruments, selectedId) {
      select.innerHTML = "";
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "Instrument waehlen";
      select.appendChild(placeholder);
      for (const inst of instruments) {
        const opt = document.createElement("option");
        opt.value = String(inst.id);
        const name = inst.name || inst.code || ("#" + inst.id);
        opt.textContent = `${name} (${inst.code || "-"})`;
        select.appendChild(opt);
      }
      if (selectedId) select.value = String(selectedId);
    }

    function renderWatchlist(items) {
      watchTbody.innerHTML = "";
      state.watch.byId.clear();
      state.watch.rowById.clear();
      state.watch.idByCode.clear();
      state.watchPrices.clear();
      state.watchFields.clear();
      state.watchSources.clear();

      for (const it of (items || [])) {
        const id = Number(it.id);
        const code = String(it.instrument_code || it.key || "");
        const label = it.label ? String(it.label) : "";
        state.watch.byId.set(id, { code, label });
        state.watch.idByCode.set(code, id);
        if (it.price !== null && it.price !== undefined) state.watchPrices.set(code, Number(it.price));
        if (it.field) state.watchFields.set(code, String(it.field));
        if (it.price_source) state.watchSources.set(code, String(it.price_source));

        const tr = document.createElement("tr");
        const tdInst = document.createElement("td");
        const tdLabel = document.createElement("td");
        const tdPrice = document.createElement("td");
        const tdSource = document.createElement("td");
        const tdDel = document.createElement("td");
        tdPrice.classList.add("num");

        const stack = document.createElement("div");
        stack.className = "stack";
        const main = document.createElement("div");
        main.textContent = it.instrument_name || code || "—";
        const sub = document.createElement("div");
        sub.className = "subtle";
        sub.textContent = code || "";
        stack.appendChild(main);
        if (code) stack.appendChild(sub);
        tdInst.appendChild(stack);

        tdLabel.textContent = label || "—";

        const px = state.watchPrices.get(code);
        tdPrice.textContent = (px === undefined) ? "—" : fmtNum(px);

        const source = state.watchSources.get(code) || "—";
        const sourceTag = document.createElement("span");
        sourceTag.className = "source";
        sourceTag.textContent = source;
        tdSource.appendChild(sourceTag);

        const btn = document.createElement("button");
        btn.className = "button ghost";
        btn.textContent = "Entfernen";
        btn.onclick = async () => {
          setStatus("info", "Entferne Watchlist-Eintrag...");
          await api(`/api/watchlist/${id}`, { method: "DELETE" });
          state.watch.byId.delete(id);
          state.watch.rowById.delete(id);
          state.watch.idByCode.delete(code);
          tr.remove();
          setStatus("success", "Watchlist-Eintrag entfernt.");
        };
        tdDel.appendChild(btn);

        tr.appendChild(tdInst);
        tr.appendChild(tdLabel);
        tr.appendChild(tdPrice);
        tr.appendChild(tdSource);
        tr.appendChild(tdDel);
        watchTbody.appendChild(tr);
        state.watch.rowById.set(id, { priceEl: tdPrice, sourceEl: sourceTag });
      }
    }

    function renderFxRates(items) {
      fxTbody.innerHTML = "";
      state.fxRows.clear();
      state.fxInstruments.clear();
      for (const fx of (items || [])) {
        const code = String(fx.code || "");
        if (!code) continue;
        state.fxInstruments.set(code, fx);
        const pair = `${fx.base_currency || "?"}/${fx.quote_currency || "?"}`;
        const price = fx.price !== null && fx.price !== undefined ? Number(fx.price) : null;
        if (price !== null) state.fxRates.set(code, price);
        if (fx.price_source) state.priceSources.set(code, String(fx.price_source));

        const tr = document.createElement("tr");
        const tdPair = document.createElement("td");
        const tdName = document.createElement("td");
        const tdPrice = document.createElement("td");
        const tdSource = document.createElement("td");
        const tdTime = document.createElement("td");
        tdPrice.classList.add("num");

        tdPair.textContent = pair;
        tdName.textContent = fx.name || code;
        tdPrice.textContent = price === null ? "—" : fmtNum(price);

        const sourceTag = document.createElement("span");
        sourceTag.className = "source";
        sourceTag.textContent = fx.price_source || "—";
        tdSource.appendChild(sourceTag);

        tdTime.textContent = state.fxUpdatedAt.get(code) || "—";

        tr.appendChild(tdPair);
        tr.appendChild(tdName);
        tr.appendChild(tdPrice);
        tr.appendChild(tdSource);
        tr.appendChild(tdTime);
        fxTbody.appendChild(tr);
        state.fxRows.set(code, { priceEl: tdPrice, sourceEl: sourceTag, timeEl: tdTime });
      }
    }

    function renderAll(valuations) {
      portfoliosEl.innerHTML = "";
      state.portfolios.clear();
      state.codesToPortfolios.clear();
      state.fxDependents.clear();
      state.prices.clear();
      state.priceSources.clear();
      state.fxRates.clear();

      if (!valuations || !valuations.length) {
        const empty = document.createElement("div");
        empty.className = "card";
        empty.innerHTML = "<h2>Keine Portfolios</h2><div class='sub'>Lege ein Portfolio unter <a href='/manage'>Portfolio und Instrumente</a> an.</div>";
        portfoliosEl.appendChild(empty);
        return;
      }

      for (const v of valuations) {
        const pf = v.portfolio;
        const positions = v.positions || [];
        const pid = Number(pf.id);

        const card = document.createElement("section");
        card.className = "card";

        const header = document.createElement("div");
        header.className = "section-head";
        header.innerHTML = `
          <div>
            <h2>${pf.name}</h2>
            <div class="sub">Portfolio #${pf.id} - ${v.currency || "EUR"}</div>
          </div>
          <div class="stats">
            <div class="stat">
              <span class="sub">Market Value</span>
              <strong data-t="mv">${fmtNum(v.totals?.market_value)}</strong>
            </div>
            <div class="stat">
              <span class="sub">Cost Basis</span>
              <strong data-t="cb">${fmtNum(v.totals?.cost_basis)}</strong>
            </div>
            <div class="stat">
              <span class="sub">PnL</span>
              <strong data-t="pnl" class="${clsPnL(v.totals?.pnl)}">${fmtNum(v.totals?.pnl)}</strong>
            </div>
            <div class="stat">
              <span class="sub">valued_at</span>
              <strong data-t="at">${v.valued_at || "—"}</strong>
            </div>
          </div>
        `;
        card.appendChild(header);

        const table = document.createElement("table");
        table.innerHTML = `
          <thead>
            <tr>
              <th>Instrument</th>
              <th>Position</th>
              <th class="num">Menge</th>
              <th class="num">Entry</th>
              <th>Waehrung</th>
              <th class="num">Preis</th>
              <th class="num">Market Value</th>
              <th class="num">Cost Basis</th>
              <th class="num">PnL</th>
              <th class="num">PnL %</th>
              <th>Quelle</th>
            </tr>
          </thead>
          <tbody></tbody>
        `;

        const tb = table.querySelector("tbody");
        const portfolioState = {
          positions: new Map(),
          totalsEl: {
            mv: header.querySelector('[data-t="mv"]'),
            cb: header.querySelector('[data-t="cb"]'),
            pnl: header.querySelector('[data-t="pnl"]'),
            at: header.querySelector('[data-t="at"]'),
          },
          rowsByCode: new Map(),
        };

        for (const p of positions) {
          const tr = document.createElement("tr");
          const code = p.instrument_code || p.instrument_id;
          const instrumentName = p.instrument_name || code || "—";
          const positionName = p.name || "—";
          const positionCurrency = (p.position_currency || p.currency || "EUR").toUpperCase();
          const portfolioCurrency = (v.currency || p.currency || "EUR").toUpperCase();
          const fxInstrumentCode = p.fx_instrument_code || null;
          const fxInverted = !!p.fx_inverted;
          portfolioState.positions.set(code, {
            quantity: Number(p.quantity),
            entry_price: Number(p.entry_price),
            position_currency: positionCurrency,
            portfolio_currency: portfolioCurrency,
            fx_instrument_code: fxInstrumentCode,
            fx_inverted: fxInverted,
          });
          if (!state.codesToPortfolios.has(code)) state.codesToPortfolios.set(code, new Set());
          state.codesToPortfolios.get(code).add(pid);
          if (p.bid !== null && p.bid !== undefined) state.bids.set(code, Number(p.bid));
          const initialPrice = (p.price !== null && p.price !== undefined)
            ? Number(p.price)
            : (p.bid !== null && p.bid !== undefined ? Number(p.bid) : null);
          if (initialPrice !== null) state.prices.set(code, initialPrice);
          if (p.price_source) state.priceSources.set(code, String(p.price_source));
          if (fxInstrumentCode && p.fx_rate !== null && p.fx_rate !== undefined) {
            const fxRate = Number(p.fx_rate);
            const rawRate = fxInverted && fxRate ? (1 / fxRate) : fxRate;
            state.fxRates.set(fxInstrumentCode, rawRate);
          }
          if (fxInstrumentCode) {
            if (!state.fxDependents.has(fxInstrumentCode)) state.fxDependents.set(fxInstrumentCode, new Set());
            state.fxDependents.get(fxInstrumentCode).add(`${pid}:${code}`);
          }

          const tdInst = document.createElement("td");
          const instStack = document.createElement("div");
          instStack.className = "stack";
          const instMain = document.createElement("div");
          instMain.textContent = instrumentName;
          const instSub = document.createElement("div");
          instSub.className = "subtle";
          instSub.textContent = code ? String(code) : "";
          instStack.appendChild(instMain);
          if (code) instStack.appendChild(instSub);
          tdInst.appendChild(instStack);

          const tdPos = document.createElement("td");
          tdPos.textContent = positionName;

          const tdQty = document.createElement("td");
          tdQty.className = "num";
          tdQty.textContent = fmtNum(p.quantity);

          const tdEntry = document.createElement("td");
          tdEntry.className = "num";
          tdEntry.textContent = fmtNum(p.entry_price);

          const tdCurr = document.createElement("td");
          tdCurr.textContent = positionCurrency;

          const tdBid = document.createElement("td");
          tdBid.className = "num";
          tdBid.textContent = (initialPrice === null) ? "—" : fmtNum(initialPrice);

          const tdMv = document.createElement("td");
          tdMv.className = "num";
          tdMv.textContent = (p.market_value === null || p.market_value === undefined) ? "—" : fmtNum(p.market_value);

          const tdCb = document.createElement("td");
          tdCb.className = "num";
          tdCb.textContent = fmtNum(p.cost_basis);

          const tdPnl = document.createElement("td");
          tdPnl.className = "num " + clsPnL(p.pnl);
          tdPnl.textContent = (p.pnl === null || p.pnl === undefined) ? "—" : fmtNum(p.pnl);

          const tdPnlPct = document.createElement("td");
          tdPnlPct.className = "num " + clsPnL(p.pnl);
          tdPnlPct.textContent = (p.pnl_pct === null || p.pnl_pct === undefined) ? "—" : fmtPct(p.pnl_pct);

          const tdSource = document.createElement("td");
          const sourceTag = document.createElement("span");
          sourceTag.className = "source";
          sourceTag.textContent = state.priceSources.get(code) || "—";
          tdSource.appendChild(sourceTag);

          tr.appendChild(tdInst);
          tr.appendChild(tdPos);
          tr.appendChild(tdQty);
          tr.appendChild(tdEntry);
          tr.appendChild(tdCurr);
          tr.appendChild(tdBid);
          tr.appendChild(tdMv);
          tr.appendChild(tdCb);
          tr.appendChild(tdPnl);
          tr.appendChild(tdPnlPct);
          tr.appendChild(tdSource);
          tb.appendChild(tr);

          portfolioState.rowsByCode.set(code, { bidEl: tdBid, mvEl: tdMv, pnlEl: tdPnl, pnlPctEl: tdPnlPct, sourceEl: sourceTag });
        }
        card.appendChild(table);
        portfoliosEl.appendChild(card);
        state.portfolios.set(pid, portfolioState);
      }
    }

    function calcPositionMetrics(pos, price) {
      if (price === null || price === undefined) {
        return { mv: null, cb: null, pnl: null, pnlPct: null };
      }
      const mvLocal = price * pos.quantity;
      const cbLocal = pos.entry_price * pos.quantity;
      const pnl = mvLocal - cbLocal;
      const pnlPct = cbLocal ? (pnl / cbLocal) : null;
      return { mv: mvLocal, cb: cbLocal, pnl, pnlPct };
    }

    function calcPortfolioMetrics(pos, price) {
      if (price === null || price === undefined) {
        return { mv: null, cb: null };
      }
      const mvLocal = price * pos.quantity;
      const cbLocal = pos.entry_price * pos.quantity;
      if (pos.position_currency === pos.portfolio_currency) {
        return { mv: mvLocal, cb: cbLocal };
      }
      if (!pos.fx_instrument_code) {
        return { mv: null, cb: null };
      }
      const rawRate = state.fxRates.get(pos.fx_instrument_code);
      if (!rawRate) {
        return { mv: null, cb: null };
      }
      const fxRate = pos.fx_inverted && rawRate ? (1 / rawRate) : rawRate;
      return { mv: mvLocal * fxRate, cb: cbLocal * fxRate };
    }

    function updatePositionRow(pid, code) {
      const pf = state.portfolios.get(pid);
      if (!pf) return;
      const row = pf.rowsByCode.get(code);
      const pos = pf.positions.get(code);
      if (!row || !pos) return;
      const price = state.prices.get(code);
      const metrics = calcPositionMetrics(pos, price);
      row.bidEl.textContent = (price === undefined) ? "—" : fmtNum(price);
      row.mvEl.textContent = metrics.mv === null ? "—" : fmtNum(metrics.mv);
      row.pnlEl.textContent = metrics.pnl === null ? "—" : fmtNum(metrics.pnl);
      row.pnlPctEl.textContent = metrics.pnlPct === null ? "—" : fmtPct(metrics.pnlPct);
      row.pnlEl.className = "num " + clsPnL(metrics.pnl);
      row.pnlPctEl.className = "num " + clsPnL(metrics.pnl);
      row.sourceEl.textContent = state.priceSources.get(code) || "—";
    }

    function recomputePortfolio(pid) {
      const pf = state.portfolios.get(pid);
      if (!pf) return;
      let mv = 0;
      let cb = 0;
      for (const [code, pos] of pf.positions.entries()) {
        const price = state.prices.get(code);
        const metrics = calcPortfolioMetrics(pos, price);
        if (metrics.mv !== null) mv += metrics.mv;
        if (metrics.cb !== null) cb += metrics.cb;
      }
      const pnl = mv - cb;
      pf.totalsEl.mv.textContent = fmtNum(mv);
      pf.totalsEl.cb.textContent = fmtNum(cb);
      pf.totalsEl.pnl.textContent = fmtNum(pnl);
      pf.totalsEl.pnl.className = clsPnL(pnl);
      pf.totalsEl.at.textContent = new Date().toISOString();
    }

    function applyQuoteUpdate(key, bid, price, watchPrice, watchField, quotetime, priceSource, watchSource) {
      if (!key) return;
      const code = String(key);
      if (bid !== null && bid !== undefined) state.bids.set(code, Number(bid));
      if (price !== null && price !== undefined) {
        state.prices.set(code, Number(price));
      } else if (bid !== null && bid !== undefined) {
        state.prices.set(code, Number(bid));
      }
      if (priceSource) state.priceSources.set(code, String(priceSource));
      if (watchPrice !== null && watchPrice !== undefined) state.watchPrices.set(code, Number(watchPrice));
      if (watchField) state.watchFields.set(code, String(watchField));
      if (watchSource) state.watchSources.set(code, String(watchSource));
      lastQuoteAtEl.textContent = (quotetime && String(quotetime).trim()) ? String(quotetime) : new Date().toLocaleTimeString();

      const wid = state.watch.idByCode.get(code);
      if (wid !== undefined) {
        const row = state.watch.rowById.get(wid);
        if (row) {
          const px = state.watchPrices.get(code);
          row.priceEl.textContent = (px === undefined) ? "—" : fmtNum(px);
          row.sourceEl.textContent = state.watchSources.get(code) || "—";
        }
      }

      if (state.fxInstruments.has(code)) {
        const fxPrice = price !== null && price !== undefined ? Number(price) : null;
        if (fxPrice !== null) state.fxRates.set(code, fxPrice);
        if (quotetime) state.fxUpdatedAt.set(code, String(quotetime));
        const fxRow = state.fxRows.get(code);
        if (fxRow) {
          fxRow.priceEl.textContent = fxPrice === null ? "—" : fmtNum(fxPrice);
          fxRow.sourceEl.textContent = state.priceSources.get(code) || "—";
          fxRow.timeEl.textContent = state.fxUpdatedAt.get(code) || "—";
        }
        const dependent = state.fxDependents.get(code);
        if (dependent) {
          for (const entry of dependent.values()) {
            const [pidStr, instrumentCode] = entry.split(":");
            updatePositionRow(Number(pidStr), instrumentCode);
            recomputePortfolio(Number(pidStr));
          }
        }
      }

      const pids = state.codesToPortfolios.get(code);
      if (!pids) return;
      for (const pid of pids.values()) {
        updatePositionRow(pid, code);
        recomputePortfolio(pid);
      }
    }

    let ws = null;
    function connectWs() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
      const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
      ws = new WebSocket(wsUrl);
      streamStateEl.textContent = "connecting...";

      ws.onopen = () => {
        streamStateEl.textContent = "connected";
        setStatus("success", "Stream verbunden. Updates kommen live.");
      };
      ws.onclose = () => {
        streamStateEl.textContent = "disconnected";
        setStatus("warn", "Stream getrennt. Reconnect in 2s...");
        setTimeout(connectWs, 2000);
      };
      ws.onerror = () => {
        streamStateEl.textContent = "error";
      };
      ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }

        if (msg.type === "status") {
          setStatus(msg.level || "info", msg.message || "");
          return;
        }

        if (msg.type === "snapshot") {
          renderAll(msg.valuations || []);
          renderWatchlist(msg.watchlist || []);
          renderFxRates(msg.fx_rates || []);
          return;
        }

        if (msg.type === "quote") {
          applyQuoteUpdate(
            msg.key || msg.instrument_code || msg.isin,
            msg.bid,
            msg.price,
            msg.watch_price,
            msg.watch_field,
            msg.quotetime,
            msg.price_source,
            msg.watch_source
          );
        }
      };
    }

    reconnectBtn.onclick = () => {
      try { if (ws) ws.close(); } catch {}
      connectWs();
    };

    watchInstrumentEl.onchange = () => {
      const inst = state.instruments.find(i => String(i.id) === String(watchInstrumentEl.value));
      if (inst && inst.currency) watchCurrencyEl.value = inst.currency;
    };

    addWatchBtn.onclick = async () => {
      const instrumentId = Number(watchInstrumentEl.value);
      if (!instrumentId) {
        setStatus("warn", "Bitte ein Instrument waehlen.");
        return;
      }
      const label = (watchLabelEl.value || "").trim();
      const currency = (watchCurrencyEl.value || "EUR").trim().toUpperCase();
      setStatus("info", "Fuege Watchlist-Eintrag hinzu...");
      await api("/api/watchlist", {
        method: "POST",
        body: JSON.stringify({ instrument_id: instrumentId, label: label || null, currency }),
      });
      const list = await api("/api/watchlist");
      renderWatchlist(list);
      watchLabelEl.value = "";
      watchInstrumentEl.value = "";
      setStatus("success", "Watchlist-Eintrag hinzugefuegt.");
    };

    Promise.all([api("/api/instruments"), api("/api/fx-rates"), api("/api/portfolios/valuations"), api("/api/watchlist")])
      .then(([instruments, fxRates, vals, watch]) => {
        state.instruments = instruments || [];
        state.fxInstruments.clear();
        for (const fx of (fxRates || [])) {
          if (fx.code) state.fxInstruments.set(fx.code, fx);
        }
        renderInstrumentSelect(watchInstrumentEl, state.instruments);
        renderAll(vals);
        renderWatchlist(watch);
        renderFxRates(fxRates);
        connectWs();
      })
      .catch(e => setStatus("error", String(e.message || e)));
  </script>
</body>
</html>
