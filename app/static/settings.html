<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Einstellungen</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #6b7280;
      --line: #e6e9f0;
      --accent: #2d6cdf;
      --accent-soft: #eef3ff;
      --nav-bg: #0f172a;
      --nav-text: #e2e8f0;
      --nav-muted: #94a3b8;
      --nav-hover: #1e293b;
      --nav-active: #1d4ed8;
      --nav-width: 240px;
      --nav-collapsed: 72px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--nav-width);
      background: var(--nav-bg);
      color: var(--nav-text);
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 18px 14px;
      transition: width 0.2s ease;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--nav-active);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
    }
    .brand-title { font-weight: 600; letter-spacing: 0.02em; }
    .nav-toggle {
      margin-left: auto;
      border: 1px solid #334155;
      background: transparent;
      color: var(--nav-text);
      border-radius: 8px;
      padding: 4px 8px;
      cursor: pointer;
    }
    .nav { display: flex; flex-direction: column; gap: 6px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--nav-text);
      text-decoration: none;
    }
    .nav-item:hover { background: var(--nav-hover); }
    .nav-item.active {
      background: #1f2a44;
      border: 1px solid #334155;
    }
    .nav-icon { width: 22px; text-align: center; font-weight: 600; }
    .nav-text { white-space: nowrap; }
    .nav-footer { margin-top: auto; font-size: 12px; color: var(--nav-muted); }
    .main { flex: 1; min-width: 0; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px 32px 32px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 28px; }
    h2 { margin: 0 0 6px 0; font-size: 20px; }
    .sub { color: var(--muted); font-size: 14px; }
    .button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }
    .button.ghost {
      background: transparent;
      color: var(--accent);
    }
    input {
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
    }
    .status.info { background: #eef3ff; color: #23448b; }
    .status.success { background: #e7f7ea; color: #1f6f3a; }
    .status.warn { background: #fff2dc; color: #8a5a17; }
    .status.error { background: #ffe7ea; color: #8f1d2f; }
    .inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .form-grid {
      display: grid;
      gap: 12px;
      margin-top: 12px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .field .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text);
      text-transform: none;
      letter-spacing: 0;
    }
    input[type="checkbox"] { width: auto; }
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    body.nav-collapsed .sidebar { width: var(--nav-collapsed); }
    body.nav-collapsed .nav-text,
    body.nav-collapsed .brand-title,
    body.nav-collapsed .nav-footer { display: none; }
    @media (max-width: 900px) {
      .app { flex-direction: column; }
      .sidebar { width: 100%; flex-direction: row; align-items: center; }
      body.nav-collapsed .sidebar { width: 100%; }
      .nav { flex-direction: row; flex-wrap: wrap; }
      .nav-footer { display: none; }
      header { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sideNav">
      <div class="brand">
        <div class="logo">PV</div>
        <div class="brand-title">Portfolio</div>
        <button id="navToggle" class="nav-toggle" aria-label="Menue umschalten">≡</button>
      </div>
      <nav class="nav">
        <a class="nav-item" href="/" title="Uebersicht"><span class="nav-icon">U</span><span class="nav-text">Uebersicht</span></a>
        <a class="nav-item" href="/instruments" title="Instrumente"><span class="nav-icon">I</span><span class="nav-text">Instrumente</span></a>
        <a class="nav-item" href="/sources" title="Kursquellen"><span class="nav-icon">K</span><span class="nav-text">Kursquellen</span></a>
        <a class="nav-item" href="/watchlist" title="Watchlist"><span class="nav-icon">W</span><span class="nav-text">Watchlist</span></a>
        <a class="nav-item" href="/positions" title="Positionen"><span class="nav-icon">P</span><span class="nav-text">Positionen</span></a>
        <a class="nav-item active" href="/settings" title="Einstellungen"><span class="nav-icon">E</span><span class="nav-text">Einstellungen</span></a>
      </nav>
      <div class="nav-footer">Allgemeine Optionen</div>
    </aside>
    <main class="main">
      <div class="container">
        <header>
          <div>
            <div class="sub">Allgemein</div>
            <h1>Einstellungen</h1>
            <div class="sub">Systemweite Optionen</div>
          </div>
        </header>

        <div id="status" class="status info">Lade...</div>

        <section class="card" style="margin-top: 16px;">
          <h2>MQTT (Home Assistant)</h2>
          <div class="sub">Verbindungsdaten in der Datenbank</div>
          <div class="inline-form" style="margin-top: 12px;">
            <span class="pill">Status: <strong id="mqttStatus">—</strong></span>
            <button id="mqttToggleBtn" class="button">MQTT einschalten</button>
            <button id="mqttReloadBtn" class="button ghost">Neu laden</button>
          </div>
          <div class="sub" style="margin-top: 10px;">
            Availability Topic: <code id="mqttAvailability">—</code>
          </div>

          <div class="form-grid">
            <div class="field">
              <label for="mqttHost">Host</label>
              <input id="mqttHost" placeholder="mqtt.local" />
            </div>
            <div class="field">
              <label for="mqttPort">Port</label>
              <input id="mqttPort" type="number" min="1" max="65535" />
            </div>
            <div class="field">
              <label for="mqttUsername">Username</label>
              <input id="mqttUsername" placeholder="optional" />
            </div>
            <div class="field">
              <label for="mqttPassword">Password</label>
              <input id="mqttPassword" type="password" placeholder="optional" />
            </div>
            <div class="field">
              <label for="mqttClientId">Client ID</label>
              <input id="mqttClientId" placeholder="portfolio-valuator" />
            </div>
            <div class="field">
              <label for="mqttDiscovery">Discovery Prefix</label>
              <input id="mqttDiscovery" placeholder="homeassistant" />
            </div>
            <div class="field">
              <label for="mqttNodeId">Node ID</label>
              <input id="mqttNodeId" placeholder="portfolio_valuator" />
            </div>
            <div class="field">
              <label for="mqttBaseTopic">Base Topic</label>
              <input id="mqttBaseTopic" placeholder="portfolio_valuator/portfolio_valuator" />
            </div>
            <div class="field">
              <label for="mqttQos">QoS</label>
              <input id="mqttQos" type="number" min="0" max="2" />
            </div>
            <div class="field">
              <label for="mqttDebounce">Debounce (ms)</label>
              <input id="mqttDebounce" type="number" min="0" />
            </div>
            <div class="field">
              <label class="checkbox"><input id="mqttRetain" type="checkbox" /> Retain</label>
            </div>
            <div class="field">
              <label class="checkbox"><input id="mqttSkipZero" type="checkbox" /> Skip 0‑Preis</label>
            </div>
            <div class="field">
              <label for="mqttMaxPct">Max % Sprung</label>
              <input id="mqttMaxPct" type="number" min="0" step="any" />
            </div>
            <div class="field">
              <label class="checkbox"><input id="mqttRequirePrice" type="checkbox" /> Bewertung nur mit Kurs</label>
            </div>
          </div>

          <div class="inline-form" style="margin-top: 12px;">
            <button id="saveMqttBtn" class="button">Speichern</button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const navToggle = document.getElementById("navToggle");
    const storedNav = localStorage.getItem("pv_nav_collapsed");
    if (storedNav === "1") document.body.classList.add("nav-collapsed");
    if (navToggle) {
      navToggle.onclick = () => {
        document.body.classList.toggle("nav-collapsed");
        localStorage.setItem(
          "pv_nav_collapsed",
          document.body.classList.contains("nav-collapsed") ? "1" : "0"
        );
      };
    }

    const mqttStatusEl = document.getElementById("mqttStatus");
    const mqttToggleBtn = document.getElementById("mqttToggleBtn");
    const mqttReloadBtn = document.getElementById("mqttReloadBtn");
    const mqttAvailabilityEl = document.getElementById("mqttAvailability");
    const mqttHostEl = document.getElementById("mqttHost");
    const mqttPortEl = document.getElementById("mqttPort");
    const mqttUsernameEl = document.getElementById("mqttUsername");
    const mqttPasswordEl = document.getElementById("mqttPassword");
    const mqttClientIdEl = document.getElementById("mqttClientId");
    const mqttDiscoveryEl = document.getElementById("mqttDiscovery");
    const mqttNodeIdEl = document.getElementById("mqttNodeId");
    const mqttBaseTopicEl = document.getElementById("mqttBaseTopic");
    const mqttQosEl = document.getElementById("mqttQos");
    const mqttDebounceEl = document.getElementById("mqttDebounce");
    const mqttRetainEl = document.getElementById("mqttRetain");
    const mqttSkipZeroEl = document.getElementById("mqttSkipZero");
    const mqttMaxPctEl = document.getElementById("mqttMaxPct");
    const mqttRequirePriceEl = document.getElementById("mqttRequirePrice");
    const saveMqttBtn = document.getElementById("saveMqttBtn");

    function setStatus(level, message) {
      statusEl.className = "status " + level;
      statusEl.textContent = message;
    }

    async function api(path, options={}) {
      const res = await fetch(path, { cache: "no-store", headers: { "Content-Type": "application/json" }, ...options });
      if (!res.ok) {
        const txt = await res.text().catch(() => "");
        throw new Error(txt || ("HTTP " + res.status));
      }
      if (res.status === 204) return null;
      const ct = res.headers.get("content-type") || "";
      if (ct.includes("application/json")) {
        const txt = await res.text();
        return txt ? JSON.parse(txt) : null;
      }
      return await res.text();
    }

    async function loadMqttStatus() {
      const s = await api("/api/mqtt");
      const enabled = !!s.enabled;
      const connected = !!s.connected;
      const host = s.host || "";
      mqttStatusEl.textContent = enabled
        ? (connected ? `an (verbunden: ${host})` : `an (nicht verbunden: ${host || "MQTT_HOST fehlt"})`)
        : "aus";
      mqttToggleBtn.textContent = enabled ? "MQTT ausschalten" : "MQTT einschalten";
      mqttAvailabilityEl.textContent = s.availability_topic || "—";
      return s;
    }

    async function loadMqttConfig() {
      const s = await api("/api/settings/mqtt");
      mqttHostEl.value = s.host || "";
      mqttPortEl.value = s.port ?? 1883;
      mqttUsernameEl.value = s.username || "";
      mqttPasswordEl.value = s.password || "";
      mqttClientIdEl.value = s.client_id || "";
      mqttDiscoveryEl.value = s.discovery_prefix || "";
      mqttNodeIdEl.value = s.node_id || "";
      mqttBaseTopicEl.value = s.base_topic || "";
      mqttQosEl.value = s.qos ?? 0;
      mqttDebounceEl.value = s.debounce_ms ?? 0;
      mqttRetainEl.checked = !!s.retain;
      mqttSkipZeroEl.checked = !!s.sanity_skip_zero_price;
      mqttMaxPctEl.value = s.sanity_max_pct_change ?? 0;
      mqttRequirePriceEl.checked = !!s.sanity_require_price_for_valuation;
      return s;
    }

    async function saveMqttConfig() {
      const payload = {
        host: mqttHostEl.value.trim(),
        port: Number(mqttPortEl.value || 1883),
        username: mqttUsernameEl.value.trim(),
        password: mqttPasswordEl.value,
        client_id: mqttClientIdEl.value.trim(),
        discovery_prefix: mqttDiscoveryEl.value.trim(),
        node_id: mqttNodeIdEl.value.trim(),
        base_topic: mqttBaseTopicEl.value.trim(),
        qos: Number(mqttQosEl.value || 0),
        debounce_ms: Number(mqttDebounceEl.value || 0),
        retain: !!mqttRetainEl.checked,
        sanity_skip_zero_price: !!mqttSkipZeroEl.checked,
        sanity_max_pct_change: Number(mqttMaxPctEl.value || 0),
        sanity_require_price_for_valuation: !!mqttRequirePriceEl.checked,
      };
      setStatus("info", "Speichere MQTT-Einstellungen...");
      await api("/api/settings/mqtt", { method: "PUT", body: JSON.stringify(payload) });
      await loadMqttStatus();
      setStatus("success", "MQTT-Einstellungen gespeichert.");
    }

    async function toggleMqtt() {
      const s = await api("/api/mqtt");
      const next = !s.enabled;
      setStatus("info", next ? "Schalte MQTT ein..." : "Schalte MQTT aus...");
      await api("/api/mqtt/enabled", { method: "PUT", body: JSON.stringify({ enabled: next }) });
      await loadMqttStatus();
      setStatus("success", next ? "MQTT ist an." : "MQTT ist aus.");
    }

    mqttReloadBtn.onclick = () => Promise.all([loadMqttStatus(), loadMqttConfig()])
      .catch(e => setStatus("error", String(e.message || e)));
    mqttToggleBtn.onclick = () => toggleMqtt().catch(e => setStatus("error", String(e.message || e)));
    saveMqttBtn.onclick = () => saveMqttConfig().catch(e => setStatus("error", String(e.message || e)));

    Promise.all([loadMqttStatus(), loadMqttConfig()])
      .then(() => setStatus("success", "Bereit."))
      .catch(e => setStatus("error", String(e.message || e)));
  </script>
</body>
</html>
